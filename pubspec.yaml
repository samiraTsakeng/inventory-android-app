name: wise_inventory
description: wise inventory app for stock counting.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.5

  # Camera barcode scanning
  mobile_scanner: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/2037740.png
    - assets/images/image266622.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/image266622.png"
  adaptive_icon_background: "#03045A"
  adaptive_icon_foreground: "assets/images/image266622.png"